%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/siliconfile,sr200pc20m.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiliconFile SR200PC20M 2 MP CMOS image sensor

maintainers:
  - Deniz Kokden <koekdendeniz@gmail.com>

description:
  The SiliconFile SR200PC20M is a 2 megapixel (1600 x 1200) CMOS image
  sensor with an integrated image signal processor that outputs YCbCr 4:2:2
  over a one-lane MIPI CSI-2 interface. It is controlled over I2C with
  8-bit registers in pages and has a reset and a standby input.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: siliconfile,sr200pc20m

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: Master clock (MCLK), 24 MHz

  avdd-supply:
    description: Analog supply, 2.8 V

  dovdd-supply:
    description: Digital I/O supply, 1.8 V

  reset-gpios:
    maxItems: 1
    description: Reset input, active low

  powerdown-gpios:
    maxItems: 1
    description: Standby input, active low

  orientation: true

  rotation: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

          link-frequencies: true

        required:
          - data-lanes

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply
  - reset-gpios
  - powerdown-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@20 {
            compatible = "siliconfile,sr200pc20m";
            reg = <0x20>;
            clocks = <&dcam>;
            avdd-supply = <&vddcama>;
            dovdd-supply = <&vddcamio>;
            reset-gpios = <&gpio 238 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&gpio 187 GPIO_ACTIVE_LOW>;
            orientation = <0>;
            rotation = <90>;

            port {
                endpoint {
                    remote-endpoint = <&dcam_front_in>;
                    data-lanes = <1>;
                };
            };
        };
    };
...
