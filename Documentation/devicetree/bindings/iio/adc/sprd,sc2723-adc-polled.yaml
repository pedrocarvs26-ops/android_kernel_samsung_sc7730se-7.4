%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/sprd,sc2723-adc-polled.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2723 PMIC auxiliary ADC, polled

maintainers:
  - Deniz Kokden <koekdendeniz@gmail.com>

description: |
  The 12-bit auxiliary ADC of the SC2723 PMIC (registers at offset 0x300 of
  the PMIC) with 32 multiplexed inputs, for example the battery thermistor
  on input 1 of the Samsung Galaxy Tab E. This node describes the ADC
  used by software-started single conversions with the completion status
  polled, without its interrupt and without the calibration data in the
  PMIC eFuse; it reports raw readings.

  The full description of the ADC as a function of the SC2723 PMIC on the
  ADI bus is sprd,sc2723-adc (iio/adc/sprd,sc2720-adc.yaml).

properties:
  compatible:
    const: sprd,sc2723-adc-polled

  '#io-channel-cells':
    const: 1

required:
  - compatible
  - '#io-channel-cells'

additionalProperties: false

examples:
  - |
    adc {
        compatible = "sprd,sc2723-adc-polled";
        #io-channel-cells = <1>;
    };
...
