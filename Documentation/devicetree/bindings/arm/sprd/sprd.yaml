%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/sprd/sprd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc platforms

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

properties:
  $nodename:
    const: '/'
  compatible:
    oneOf:
      - items:
          - enum:
              - samsung,gtelwifi # Samsung Galaxy Tab E 9.6 WiFi (SM-T560)
          - const: sprd,sc7730
      - items:
          - enum:
              - sprd,sc9836-openphone
          - const: sprd,sc9836
      - items:
          - enum:
              - sprd,sp9860g-1h10
          - const: sprd,sc9860
      - items:
          - enum:
              - sprd,sp9863a-1h10
          - const: sprd,sc9863a

      - items:
          - enum:
              - sprd,ums512-1h10
          - const: sprd,ums512

      - items:
          - enum:
              - sprd,ums9620-2h10
          - const: sprd,ums9620

  sprd,sc-id:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    minItems: 1
    maxItems: 16
    items:
      items:
        - description: Chip family ID, 8830 for the SC7730/SC8830 SoCs
        - description:
            Hardware revision of the board (the boot loader's hw_revision);
            the boot loader takes the first entry that matches it exactly
        - description: SoC revision field of the table entry, 0x20000
    description:
      Board identification for the Spreadtrum boot loaders of the SC7730
      (SC8830) generation. They pick the device tree to boot from a table
      appended to the Android boot image (the "dt.img", magic "SPRD", the
      layout of Qualcomm's QCDT version 1) whose entries are built from
      these triplets. One device tree can list several triplets to be used
      on several board revisions. The kernel does not use the property.

additionalProperties: true

...
